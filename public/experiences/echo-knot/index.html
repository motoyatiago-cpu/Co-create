,test:/作业|论文|考试|加班|截止|项目|汇报|开会|工作|上课|毕设|实习/,surface:`字面上，对方在说一件很实际的事。`,readings:[{text:`对方可能只是累，想把压力说出来。`,weight:42,cue:`不是每句话都需要被解读成关系信号。`},{text:`对方也可能在借工作的事，说“我已经没有余力了”。`,weight:38,cue:`当生活被任务塞满，人会把情绪藏进“忙”里。`},{text:`如果关系里长期只剩任务，可能需要一次不谈效率的对话。`,weight:30,cue:`被分担和被允许休息，比建议更有用。`}],need:{name:`被分担或允许休息`,text:`对方需要的是“辛苦了”，不一定是指点。`},avoid:[`马上给计划`,`比较谁更累`,`忽略对方的疲惫`],tags:[`疲惫`,`压力`],temperature:40},{id:`default`,name:`一句还没有被读懂的话`,test:/$^/,surface:`字面上，对方把一句话递到了你面前。`,readings:[{text:`对方可能在说一件具体的事，也可能在借这件事说一种感受。`,weight:40,cue:`信息还不够，任何确定的读法都可能是过度猜测。`},{text:`比起猜中，更重要的是你愿意问一句。`,weight:36,cue:`一句真问题，往往比十个猜测更靠近答案。`},{text:`先看语气、时间和你们最近的关系，再决定要不要把它看得那么重。`,weight:32,cue:`同一句话，在不同的关系里会有不同的重量。`}],need:{name:`被认真听完`,text:`对方可能需要一个不急着下结论的回应。`},avoid:[`把自己的猜测当成事实`,`急着解决问题`,`忽略语气和上下文`],tags:[`不确定`],temperature:50}],HS=[`silence`,`farewell`,`conflict`,`absolute`,`rhetorical`,`forget-it`,`seeking-reassurance`,`apology`,`boundary`,`busy`,`cold-ack`,`sarcasm`,`whatever`,`as-you-wish`,`fine`,`sleep`,`laugh`,`care`,`share`,`help`,`affection`,`work`];function US(e){let t=String(e||``).trim();if(!t)return VS[VS.length-1];for(let e of HS){let n=VS.find(t=>t.id===e);if(n&&(typeof n.test==`function`?n.test(t):n.test.test(t)))return n}return VS[VS.length-1]}var WS=[{key:`warm`,label:`温柔靠近`,note:`先接住情绪，让人知道你在。`,hint:`适合对方正在难受、需要被听见的时候。`},{key:`clear`,label:`清楚说明`,note:`把感受和边界说清，不指责。`,hint:`适合你需要保护自己、或想把误会说明白的时候。`},{key:`space`,label:`留一点白`,note:`不追问，也不消失。`,hint:`适合对方需要空间、或你还没准备好继续的时候。`}],GS={silence:{warm:`在的。不急，你什么时候想回都可以；如果现在只是需要安静，也告诉我一声，我就不打扰。`,clear:`我注意到对话停在这里了。我想知道，是我哪里让你不舒服，还是你只是需要一点时间？两种情况我都能接住。`,space:`好，我先不追问。等你想说的时候，我在。`},farewell:{warm:`我听见这句话的分量了。先不急着说分手或再见，我想知道，是发生了什么，让你走到这里？`,clear:`如果你已经决定了，我会认真尊重；如果你只是太累了，我们可以先停战，等情绪落地再谈。`,space:`我不会用哀求留住你，也不会装作没事。等我们都冷静一点，给这件事一次好好谈的机会，可以吗？`},conflict:{warm:`刚才那样，我知道你一定也不好受。我先不争对错，想先听听，你哪里被伤到了。`,clear:`这次争执里我们都有情绪。我可以为我说重的那句话道歉，也想请你告诉我，你真正介意的是什么。`,space:`我们都先停一下。等气消一点，再回来把这件事说清，不带着刺说。`},absolute:{warm:`你说“总是”的时候，我感觉你攒了很久的委屈。能不能告诉我，最近哪一次最让你难受？`,clear:`我听见你的失望了。只是“总是”这个说法让我有点接不住，我们可以就事论事，从最近那一次说起吗？`,space:`我不想急着辩解。等你说完，我们再一起看，哪些是真的，哪些是气话。`},rhetorical:{warm:`我听见你话里的不安了。比起回答这个问题，我更想知道，你是不是觉得我没有站在你这边？`,clear:`我可以认真回答你的问题，但也想请你直接告诉我，你希望我怎么做。`,space:`这个问题我先不急着答。等你愿意的时候，我们把真正想问的那句说出来，好吗？`},"forget-it":{warm:`别急着算了。你刚才想说的那句话，我还想听。`,clear:`如果你现在不想说，我尊重。但我不想让这件事就这么过去，你看什么时候方便，我们再聊。`,space:`好，先缓缓。等你想说的时候，我还在。`},"seeking-reassurance":{warm:`没有。你没有烦我。你愿意这样问，说明你在乎这段关系，我也在乎。`,clear:`我不会因为你有情绪就走开。你需要的确认，可以直接跟我要，不用先把自己说小。`,space:`现在不用逼自己想清楚。你先休息，明天醒来我还在。`},apology:{warm:`谢谢你愿意说对不起。我收下了，也想让你知道，我不希望你把所有责任都揽走。`,clear:`我接受你的道歉，但我也想说说我的部分。这件事不是你一个人的错，我们把各自的那一半分清楚。`,space:`道歉我收到了。先不用急着补救，给彼此一点时间消化，好吗？`},boundary:{warm:`好，我给你空间。你不用解释，等你想说话的时候，我在。`,clear:`我尊重你需要空间。也请你告诉我，大概什么时候可以再联系，这样我不会瞎猜。`,space:`好。那今晚就先到这里，我等你。`},busy:{warm:`我知道你是在体谅我，但我更想知道你真正想要什么。你不用把自己往后放。`,clear:`我确实在忙，但不是不想理你。我大概几点结束，到时候我来找你。`,space:`好，你先忙。等你方便的时候跟我说一声，我们再聊。`},"cold-ack":{warm:`收到。感觉你好像不太想多说，如果你需要我，我在；如果只是想安静一会儿，也没关系。`,clear:`这个“哦”让我有点不确定。是我说错什么了吗？还是你现在只是没力气聊？`,space:`好，那不打扰你。等你想说的时候再找我。`},sarcasm:{warm:`你这句话听起来有点刺。是不是我刚才哪里让你不舒服了？`,clear:`我可以接住你的不满，但用反话我会听不清。你直接告诉我，我会更知道怎么做。`,space:`我感觉你话里有话。现在不想说也可以，等你想直说的时候，我听。`},whatever:{warm:`我听见“随便”了，但我有点在意。你是不是原本有想要的答案，只是没说？`,clear:`我不想替你决定。你可以直接告诉我你的偏好，哪怕只是“我更想这样”。`,space:`那我们先不决定。等你想清楚，再说也可以。`},"as-you-wish":{warm:`你说“你开心就好”，可我更想知道，那你呢？你也开心吗？`,clear:`我希望这件事里也有你的意愿，而不是只有我的。你的想法对我很重要。`,space:`那今晚先按你的舒服来。等你想说自己的部分，我再听。`},fine:{warm:`你说没事，我听见了。但如果你其实有事，也可以不用现在说，我陪着就好。`,clear:`我不逼你，只是想说：你不用在我面前一直没事。`,space:`好，我相信你现在不想展开。那我不追问，你想说的时候我在。`},sleep:{warm:`好，去睡吧。今晚不解决也可以，晚安。`,clear:`晚安。不过我想确认一下，你是不想聊了，还是我们明天可以继续？`,space:`去休息吧。明天醒来，如果还想说，我还在。`},laugh:{warm:`你笑了，但我怎么觉得有点苦。是不是其实不太舒服？`,clear:`我不太确定这个笑是开心还是打圆场。你可以直接告诉我你的感受。`,space:`那我先不追问。你想认真说的时候，我听着。`},care:{warm:`谢谢你问我。我也想问一句，你今天怎么样？`,clear:`我收到你的关心了。也请你别只顾着照顾我，你的需要也可以说出来。`,space:`我挺好的，别担心。你先照顾好自己，我们晚点聊。`},share:{warm:`你居然第一个想到我，快说说，后来呢？`,clear:`谢谢你愿意跟我分享。我很想听细节，你慢慢说。`,space:`看到了，很有趣。你先忙，晚点我们再聊这件事。`},help:{warm:`我在。你先慢慢说，不急着整理好。`,clear:`我可以陪你，也想先知道，你现在是需要我听，还是需要一起想办法？`,space:`我在。你先深呼吸一下，等你想开口的时候，我都在。`},affection:{warm:`我也想你。被你这样惦记着，我觉得很暖。`,clear:`谢谢你告诉我。我想认真回应你：我也在乎你，只是我需要一点时间，用自己的方式靠近。`,space:`我收到了。给我一点时间消化，好吗？我不会敷衍你。`},work:{warm:`听起来你真的累了。今天先别管效率，能撑到这里已经很不容易。`,clear:`你需要我帮你分担哪一部分？还是只想先被听一听？`,space:`好，那你先忙。记得吃饭，忙完早点休息。`}},KS={委屈:{warm:`我知道你心里那点酸，不是想赢，是想被公平地看见。先别急着懂事。`,clear:`我可以承认：这件事让我很委屈。我需要的是被认真对待，而不是被一句“别想太多”带过。`,space:`现在不必想通。我允许自己委屈一会儿，等心里松一点，再决定要不要说。`},生气:{warm:`你的愤怒不是无理取闹，它在替一条被越过的边界说话。`,clear:`我需要你停止这件事。我生气，是因为我的边界被反复越过。`,space:`先不爆发，也不压下。我可以等火气落一点，再说出真正想守的东西。`},失望:{warm:`失望不是突然来的，是一次次期待落空，慢慢凉下来的。你不需要假装无所谓。`,clear:`我原本期待的是这件事。它没有发生，我确实难过。`,space:`今晚先不总结这段关系。我可以先承认自己失望，但不急着下结论。`},焦虑:{warm:`焦虑在替你提前受伤。你已经想了很远，先回到此刻。`,clear:`我现在担心的是这件事。我能做的下一步，是把可控的部分写下来。`,space:`不用今晚就想清楚所有可能。先睡一觉，明天再处理。`},孤独:{warm:`孤独不是身边没人，是有一句话找不到能接住的人。你可以先接住自己。`,clear:`我现在需要有人听我说。我可以主动发出这句邀请，而不是等别人猜。`,space:`今晚不必强行热闹。我可以陪自己待一会儿，也允许明天再去找人。`},疲惫:{warm:`你不是不够努力，是已经撑了太久。停下来不需要先完成所有事。`,clear:`我现在没有余力处理这件事。我需要休息，需要被分担一部分。`,space:`今晚先不解决。把能放的放下，剩下的明天再说。`},难过:{warm:`难过需要被陪着，而不是被立刻修好。你可以先不坚强。`,clear:`我现在很难过，我需要的是陪伴，不是建议。`,space:`我不急着从难过里出来。先允许它待一会儿。`},害怕:{warm:`害怕不是脆弱，是有东西对你太重要了。`,clear:`我害怕失去的是这件事。我想确认它，而不是先把自己吓退。`,space:`现在不用做决定。等安全一点，再靠近这个问题。`},内疚:{warm:`内疚说明你在意。但你不必把自己整个人都判成错的。`,clear:`我愿意为我的部分负责，也需要把不属于我的责任放下。`,space:`先不用急着补偿。等心里稳一点，再看怎么修复。`},羞耻:{warm:`你可以有不够好的地方，这不妨碍你值得被爱。`,clear:`我有一件事不敢被看见。我想试着说出来，而不是把自己藏起来。`,space:`现在不揭开也可以。先让自己安全，再决定给谁看。`},麻木:{warm:`麻木有时不是没有感觉，是感觉太多，只能先关掉。你可以慢慢来。`,clear:`我现在感觉不到什么。我不逼自己立刻有反应，但我会留意身体。`,space:`今晚不处理情绪。先吃一点、睡一觉，等感觉回来。`},思念:{warm:`思念不是没放下，是那段关系还在心里占着一个位置。你可以想念，也可以往前走。`,clear:`我想念的是这个人，也是那时候被爱着的自己。这两件事我都承认。`,space:`今晚不逼自己放下。让想念待一会儿，天亮再说。`},说不清:{warm:`说不清不是没有感受，只是它还没找到形状。你可以先用“我有点乱”开始。`,clear:`我现在说不清，但我知道自己不舒服。我需要一点时间，把感受理出轮廓。`,space:`不需要一次说对。这个问题可以先放着，等它自己浮出来。`}};function qS(e,t=!1,n=`说不清`){let r=WS;if(t){let e=KS[n]||KS.说不清;return r.map(t=>({...t,text:e[t.key]}))}let i=GS[e]||GS.whatever;return r.map(e=>({...e,text:i[e.key]}))}var JS=/自杀|想死|不想活|活不下去|结束生命|伤害自己|割腕|跳楼|轻生|没有活下去的意义/;function YS(e){return JS.test(String(e||``))}var XS=`我听出你此刻真的很不好受，也不想让你一个人扛。先把今天撑过去：请拨打全国心理援助热线 12356，或联系一个你信任的人，让真实的人陪在你身边。回音结不能替代专业的帮助，但我会一直在这里，陪你等到有人接住你。`,ZS=[{id:`libai`,name:`李白`,era:`唐`,title:`把孤独喝成月亮的人`,quote:`举杯邀明月，对影成三人。`,source:`《月下独酌四首·其一》`,gloss:`没有人陪的时候，他把月亮和影子请来，凑成一桌。孤独没有消失，但被他写成了辽阔。`,tags:[`孤独`,`思念`,`豪迈`,`不被理解`],opening:`今夜月色尚可。你若不急着说话，我们先对坐一会儿，也算有人陪。`,lines:[`你心里那点空，不必急着用热闹填满。月亮也有照不到的地方。`,`他们说你太敏感，我却觉得，能听见风里回声的人，耳朵是好的。`,`一个人喝酒不是可怜，是终于不用在谁面前演一个不难过的人。`,`你若有话说不出口，就先说给夜听。夜不评价，只替你收着。`,`孤独不是你没有朋友，是你有一句话，还没遇见能听懂的人。`],closing:`去吧。若今夜无人共饮，记得替自己留一盏灯。`},{id:`sushi`,name:`苏轼`,era:`宋`,title:`在雨里慢慢走的人`,quote:`竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。`,source:`《定风波·莫听穿林打叶声》`,gloss:`同行的人都狼狈躲雨，他却穿着草鞋慢慢走。不是雨停了，是他不再和雨较劲。`,tags:[`疲惫`,`焦虑`,`失望`,`释然`,`压力`],opening:`雨若还没停，就先走慢一点。竹杖芒鞋，也走得完这一程。`,lines:[`你不是不够好，你只是赶路赶得太久了。`,`有些事今晚想不通，就留给明天的风。`,`人间的雨不会只淋你一个。可你也不必因此，就假装自己不冷。`,`被贬到很远的地方，我也照样煮肉、写诗、看月亮。日子不是等顺了才过的。`,`若实在撑不住，就先把伞放下。淋一场雨，不会毁掉你。`],closing:`回去吧。雨停之前，允许自己慢一点。`},{id:`liqingzhao`,name:`李清照`,era:`宋`,title:`把失去写得很轻的人`,quote:`寻寻觅觅，冷冷清清，凄凄惨惨戚戚。`,source:`《声声慢·寻寻觅觅》`,gloss:`她一连用了十四个字，找一样再也找不回来的东西。有些悲伤，本来就不该被说得体面。`,tags:[`孤独`,`思念`,`难过`,`失去`,`失望`],opening:`你若也觉得屋里空，就坐近一点。今夜不必装作不怕冷。`,lines:[`有些东西失去了，就是失去了。你可以为它难过，不必急着说“我没事”。`,`他们劝你往前看，可我知道，回头看的时候，心是真的会疼。`,`思念不丢人。丢人的是那些要你把思念藏起来的人。`,`我把话写在纸上，纸不会劝我别哭。你也可以写下来，哪怕只写一句。`,`冷冷清清的日子，也能点一盏灯。灯不大，够照见你自己就好。`],closing:`夜里凉，记得添衣。想哭就哭，不必等我转身。`},{id:`xinqiji`,name:`辛弃疾`,era:`宋`,title:`把愁说到天气里的人`,quote:`而今识尽愁滋味，欲说还休。欲说还休，却道天凉好个秋。`,source:`《丑奴儿·书博山道中壁》`,gloss:`真正尝过愁的人，反而不说了。别人问起，只答一句：天凉了，好个秋。`,tags:[`疲惫`,`说不清`,`麻木`,`不被理解`,`压抑`],opening:`你若要问愁是什么，我大概也只会说：天凉了。`,lines:[`有些话到了嘴边，又咽回去。不是不想说，是知道说了也未必有人懂。`,`别人看你没事，只有你知道，那句“没事”用了多大力气。`,`愁不是非要哭出来才算数。它也可以只是今天比昨天更沉默一点。`,`你不需要向所有人解释。找一个能听懂“天凉好个秋”的人就够了。`,`若今夜说不出，就别硬说。我陪你沉默一会儿。`],closing:`天凉了。回去的时候，把衣领竖起来。`},{id:`wangwei`,name:`王维`,era:`唐`,title:`走进空山的人`,quote:`行到水穷处，坐看云起时。`,source:`《终南别业》`,gloss:`走到水没有的地方，他没有回头，也没有慌，只是坐下来，看云慢慢起来。`,tags:[`焦虑`,`疲惫`,`释然`,`麻木`,`压力`],opening:`路走尽了也不要紧。坐一会儿，云会自己起来。`,lines:[`你不必一直往前。停下来，也是走路的一部分。`,`空山不见人，但闻人语响。你听见的那点回声，说明你并不完全是一个人。`,`有些答案不在下一步，在你终于愿意坐下来的那一刻。`,`焦虑会把明天的事，提前搬进今天。先把它放回明天。`,`今晚不做决定也可以。山里的云，从不急着变成雨。`],closing:`回去睡吧。水穷处，也有云。`},{id:`dufu`,name:`杜甫`,era:`唐`,title:`自己淋雨还想着别人的人`,quote:`感时花溅泪，恨别鸟惊心。`,source:`《春望》`,gloss:`山河破碎的时候，连花鸟都像在替他难过。他的心里装着的不只是自己。`,tags:[`内疚`,`委屈`,`难过`,`疲惫`,`共情`],opening:`你总是先想着别人。今夜，也让我替你想一想。`,lines:[`你照顾了那么多人的情绪，自己那一份，也该有人接。`,`不是所有事都怪你。你已经把自己能做的都做了。`,`心软不是错，但心软的人也要学会给自己留一点。`,`你替别人难过的时候，别忘了问一句：那我自己呢？`,`屋漏的时候，先补自己的屋顶，不丢人。`],closing:`回去歇着吧。今夜不必再替天下人操心。`},{id:`nalan`,name:`纳兰性德`,era:`清`,title:`记得初见的人`,quote:`人生若只如初见，何事秋风悲画扇。`,source:`《木兰花·拟古决绝词柬友》`,gloss:`如果一切都停在刚认识的时候，就没有后来的变心和秋风。可人偏偏要往后走。`,tags:[`失望`,`思念`,`失去`,`关系`,`难过`],opening:`你是不是也在想，如果停在最初就好了。`,lines:[`关系变淡，不一定是谁变坏了。有时候只是季节换了。`,`你怀念的那个开始，也可能是你当时被认真对待的感觉。`,`初见很好，后来也不全是坏的。别用一个结局，抹掉所有曾经。`,`如果对方已经走远，你不必追着问为什么。你的深情，不该用来换一个敷衍。`,`记得就好。记得不等于要回去。`],closing:`秋风起了。把该收的心，收回来一点。`},{id:`luxun`,name:`鲁迅`,era:`近代`,title:`在无路处走路的人`,quote:`其实地上本没有路，走的人多了，也便成了路。`,source:`《故乡》`,gloss:`没有现成的答案，也没有人保证方向。但人一步一步走过去，路才慢慢出现。`,tags:[`焦虑`,`迷惘`,`说不清`,`压力`,`不被理解`],opening:`没有路的时候，先走一步。第一步不必漂亮。`,lines:[`你不需要先想清楚一生，才配走出今晚这一步。`,`别人给你的答案，未必合你的脚。路是自己走出来的。`,`清醒会让人痛苦，但糊涂也救不了你。两害相权，还是清醒一点好。`,`你不必感谢那些让你难受的人和事。熬过来，是你自己的本事。`,`若四周太吵，就先做一件具体的小事。具体，能救人。`],closing:`走罢。哪怕只走到门口，也算路。`},{id:`quyuan`,name:`屈原`,era:`战国`,title:`不肯把心弄脏的人`,quote:`路漫漫其修远兮，吾将上下而求索。`,source:`《离骚》`,gloss:`路很长，结局也未必好。可他还是不肯放弃寻找。`,tags:[`委屈`,`不被理解`,`孤独`,`坚持`,`失望`],opening:`路很长。你若还愿意走，我陪你走一段。`,lines:[`被误解的时候，最难受的不是没人信，是你开始怀疑自己。`,`你不必为了合群，把自己觉得对的事说成错的。`,`清醒的人常常孤独。这不是你的错，是你看得太清。`,`求索不一定有结果。但不去找，你会更不甘心。`,`若这世界暂时听不见你，先别把自己的声音也弄丢。`],closing:`路还长。今夜先歇，明日再求索。`},{id:`taoyuanming`,name:`陶渊明`,era:`东晋`,title:`回到东篱下的人`,quote:`采菊东篱下，悠然见南山。`,source:`《饮酒二十首·其五》`,gloss:`他没有赢过什么，只是从喧闹里退出来，回到自己的院子里。南山一直在，只是从前没空看。`,tags:[`疲惫`,`释然`,`孤独`,`压力`,`麻木`],opening:`外面的声音太杂，就回来坐坐。菊花开不开，都不耽误你歇着。`,lines:[`你不必活成别人期待的样子。田园不大，够放下一颗心就行。`,`离开不是失败。有时候，离开是把自己捡回来。`,`今天只做一件小事：吃饭，洗澡，睡觉。这也算好好生活。`,`别人走得快，是别人的路。你在自己的院子里，也有四季。`,`南山不会催你。你有空的时候，它就在。`],closing:`回去吧。东篱下的花，明天还在。`}];function QS(e){return ZS.find(t=>t.id===e)||ZS[0]}function $S({emotion:e,tag
